name: release

# Tag-triggered build + publish to PyPI via trusted publishing (OIDC).
# There is no API token and no .pypirc: icpp-candid is only ever published
# from this workflow, never from a laptop.
#
# Maintainer prerequisites (one-time):
# - PyPI project `icpp-candid` with a trusted publisher for this repo,
#   workflow `release.yml`, environment `pypi`.
# - GitHub environment `pypi` on this repo.
#
# icpp-candid and icpp-pro are released in lockstep and share a version
# number. icpp-candid must be published FIRST, because icpp-pro's
# pyproject.toml pins `icpp-candid>=X.Y.Z` and its release workflow refuses
# to publish until that version is on PyPI.
# See icpp-pro/README-release-guide.md for the full ceremony.

on:
  push:
    tags:
      - "v*"

# Least privilege for every job that does not override it. Without an explicit
# map the build job would inherit the repository/organisation GITHUB_TOKEN
# default, which may grant writes. The publish job's own map overrides this
# (an explicit map sets every omitted permission to none); downloading an
# artifact from the same run needs no extra scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The minimum supported Python. The wheel is py3-none-any, so one cell
      # is enough - the full version matrix runs in icpp-pro's CI.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The version is single-sourced from src/icpp_candid/version.py; nothing
      # in the build reads the git tag. Without this assert, tagging v6.1.1 on
      # a tree that still says 6.1.0 would quietly publish 6.1.0 a second time.
      - name: assert the tag matches version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import sys; sys.path.append('src/icpp_candid'); import version; print(version.__version__)")
          echo "tag=$TAG  version.py=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag '$TAG' does not match src/icpp_candid/version.py '$PKG'"
            exit 1
          fi

      - name: install build tooling
        run: python -m pip install --upgrade pip build

      - name: build sdist and wheel
        run: make pypi-build

      # The wheel's real payload is the C++ sources shipped as package_data. A
      # broken package_data manifest still installs cleanly but ships nothing,
      # which only surfaces later as a failed canister build.
      - name: smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/icpp_candid-*.whl
          /tmp/clean/bin/python -c "
          import pathlib, icpp_candid
          from icpp_candid import version
          root = pathlib.Path(icpp_candid.__file__).parent
          for must in ['candid/candid_type.h', 'hooks/icpp_hooks.h']:
              assert (root / must).is_file(), f'missing from wheel: {must}'
          print('icpp_candid', version.__version__, 'ok')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # A separate job so the OIDC token is minted in a context that checks out no
  # code and runs no build steps - it only downloads the vetted artifact and
  # uploads it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: list distributions
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
